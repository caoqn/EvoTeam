[project]
name = "evoteam-mixed-benchmark"
version = "0.1.0"
description = "EvoTeam: Multi-Agent Collaboration via Evolving Teams"
requires-python = ">=3.10"
dependencies = [
    "litellm==1.80.17",
    "pyyaml>=6.0",
    "duckduckgo-search>=7.0.0",
    "ddgs>=9.0.0",
    "aiohttp>=3.9.0",
    "certifi",
    "docker>=7.0.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.0",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "python-pptx>=1.0",
    "fastmcp>=2.0.0,<3.0.0",
    "excel-mcp-server>=0.1.8",
]

[tool.setuptools.packages.find]
include = ["benchmarks*", "core*"]

[tool.setuptools]
py-modules = ["runtime_pool"]